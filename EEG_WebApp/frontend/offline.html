<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독립 사진 측정 · 뇌피셜</title><link rel="stylesheet" href="/static/style.css"><style>
main{max-width:950px;margin:auto;padding:1.5rem}#stage{position:fixed;inset:0;background:#777;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}#stage[hidden]{display:none}#photo{max-width:90vw;max-height:75vh;object-fit:contain}#cross{font-size:60px}#countdown{font-size:20px}#choices button{padding:18px;margin:5px}#sync{position:fixed;bottom:14px;right:14px;z-index:30}label{display:block;margin:.6rem 0}input,select{padding:.5rem}#log{white-space:pre-wrap}
</style></head><body><main><a href="/">실험 시작 화면</a><h1>장비 없이 사진·카메라 기록</h1>
<p>EEG는 조교님 프로그램에서 별도로 기록합니다. 두 기록에서 같은 사건을 확인할 수 있도록 트리거 또는 별도 동기화 절차를 준비하세요. 두 PC의 시계 표시만으로 정렬 정확성을 보장할 수 없습니다.</p>
<section id="setup" class="card"><label>참가자 가명 ID <input id="pid" pattern="[A-Za-z0-9_-]+" required maxlength="32"></label>
<label>사진 세트 <select id="set"><option value="portraits">인물 사진 · 남성 16장 / 여성 16장</option><option value="original">자연·도시·동물·음식 32장</option></select></label>
<label><input id="quick" type="checkbox">파일럿 4장 · 기준선 10초 (본 측정은 기준선 60초)</label>
<label><input id="consent" type="checkbox">실험 참여와 사진별 응답·마커 저장에 동의합니다.</label>
<label><input id="cam-consent" type="checkbox">카메라 움직임 수치 기록에 동의합니다.</label>
<button id="cam-on">카메라 켜기</button><button id="cam-off">끄기</button><p id="cam-status" role="status">카메라 꺼짐</p><video id="cam-preview" width="240" muted playsinline></video>
<p>사진 전 3초 → 사진 4초 → 빈 화면 3초 → Liking 1–9점. 16장 뒤에는 계속 버튼을 눌러 재개합니다.</p>
<button id="begin" class="primary">기록 시작</button></section>
<p id="message" role="status"></p><button id="export" hidden>기록 JSON 내려받기</button><p><a href="/static/align.html">나중에 EEG 파일 연결·분석하기</a></p>
</main><div id="stage" hidden><p id="progress"></p><div id="cross">+</div><img id="photo" hidden alt=""><p id="countdown"></p><div id="choices" hidden></div></div><button id="sync" hidden>공통 사건 시각 표시 (S)</button>
<script src="/static/movement.js"></script><script src="/static/offline.js"></script></body></html>
