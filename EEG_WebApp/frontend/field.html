<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>측정 결과 · BrainFicial</title><link rel="stylesheet" href="/static/style.css"><main>
<p><a href="/">← 실험 시작 화면</a></p><h1>측정 결과와 서면 설문</h1><label>기록 선택 <select id="sessions"></select></label><p id="status" role="status"></p>
<section class="card" id="analysis" hidden><h2>사진별 EEG와 움직임</h2><p id="summary"></p><p id="assoc"></p><div style="overflow:auto"><table><thead><tr><th>사진</th><th>EEG Liking (1–9)</th><th>감마 (dB)</th><th>입꼬리 변화</th><th>어깨 변화</th></tr></thead><tbody id="trials"></tbody></table></div><p>변화는 사진 구간 평균에서 직전 고정점 평균을 뺀 값입니다. 괄호는 고정점/사진 구간의 유효 프레임 수입니다. — 표시는 측정값이 부족한 경우입니다.</p></section>
