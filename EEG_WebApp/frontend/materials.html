<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>실험 사진 자료 · 뇌피셜</title><link rel="stylesheet" href="/static/style.css">
<style>main{max-width:1050px;margin:auto;padding:1.5rem}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}figure{margin:0}figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#777}figcaption{padding:.4rem 0}select{font:inherit;padding:.4rem}</style></head>
<body><main><p><a href="/">실험 시작 화면</a></p><h1>진행자용 사진 자료</h1>
<p>측정 전에 자극 파일을 점검하는 화면입니다. 참가자에게는 측정 화면에서 배정된 순서대로 사진을 보여주세요.</p>
<label>사진 범주 <select id="group"><option value="">전체</option><option value="nature">자연</option><option value="city">도시</option><option value="animal">동물</option><option value="food">음식</option></select></label>
<p id="count" role="status"></p><section id="gallery" aria-label="실험 사진"></section></main>
<script>
const group=document.getElementById("group"), gallery=document.getElementById("gallery"), count=document.getElementById("count");
async function load(){
  const response=await fetch("/stimuli/manifest.json");if(!response.ok)throw Error("사진 목록을 열 수 없습니다.");
  const {stimuli}=await response.json();
  function draw(){
    const rows=stimuli.filter(s=>!group.value||s.category===group.value);
    count.textContent=rows.length+"장";gallery.replaceChildren();
    for(const photo of rows){
      const figure=document.createElement("figure"),img=new Image(),caption=document.createElement("figcaption");
      img.alt=photo.title;img.src=photo.src;caption.textContent=photo.title+" · "+photo.id;
      img.onerror=()=>caption.append(" · 파일 열기 실패");
      const credit=document.createElement("a");credit.href=photo.credit.source;credit.textContent="사진 출처";
      figure.append(img,caption,credit);gallery.append(figure);
    }
  }
  group.onchange=draw;draw();
}
load().catch(e=>count.textContent=e.message);
</script></body></html>
